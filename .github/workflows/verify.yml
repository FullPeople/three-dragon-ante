name: Verify standalone Three-Dragon Ante
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.17.1'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts --prefix server/three-dragon
      - run: npm run build
      - run: npm run build:server
      - run: npm run test:host-refresh-grace
      - run: npm run test:website-auth-timeout
      - run: npx playwright install --with-deps chromium
      - run: npm run test:nameplate
      - run: npm run test:website-omniscient
      - run: npm run test:site-presentation
      - run: npm test
      - run: npm run test:server
      - run: npm run test:guest-server
      - run: npm run test:empty-room
      - run: npm run test:page-route
      - run: python tools/release-three-dragon-selftest.py
      - run: npm run test:browser
      - run: node tools/site-entry-browser.mjs
      - run: npm run test:server-browser
      - run: npm run test:site-websocket-fixture
      - run: npm run test:site-multiplayer
      - run: npm run test:fx3d
      - run: npm run test:flight-layer
      - run: npm run test:fx3d-lifecycle
      - run: npm run test:performance-structure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: three-dragon-validation
          include-hidden-files: true
          path: |
            .local-evidence/**/*.json
            .local-evidence/**/*.png
            .local-evidence/**/*.log
